// fxvps.ai client wire protocol, version 1.
// See crates/client-proto/PROTOCOL.md for semantics. Field numbers are frozen:
// only add new fields/messages; never renumber or reuse.
syntax = "proto3";

package fxvps.client.v1;

// Fixed-point decimal: real value = value * 10^-scale.
message Decimal {
  int64 value = 1;
  uint32 scale = 2;
}

// Every frame is exactly one Envelope.
message Envelope {
  // Protocol version of the sender (current: 1).
  uint32 version = 1;
  // Sender-side monotonically increasing frame sequence (informational).
  uint64 seq = 2;
  oneof body {
    Hello hello = 10;
    Auth auth = 11;
    AuthOk auth_ok = 12;
    Subscribe subscribe = 20;
    Unsubscribe unsubscribe = 21;
    QuoteBatch quote_batch = 22;
    // Added in v1.3: LP depth of a symbol the connection asked depth for.
    Depth depth = 23;
    CandleRequest candle_request = 30;
    CandleResponse candle_response = 31;
    SymbolListRequest symbol_list_request = 32;
    SymbolList symbol_list = 33;
    AccountSnapshot account_snapshot = 40;
    PositionUpdate position_update = 41;
    OrderUpdate order_update = 42;
    PlaceOrder place_order = 50;
    CancelOrder cancel_order = 51;
    ModifyOrder modify_order = 52;
    // Added in v1.2.
    ModifyPosition modify_position = 53;
    ClosePosition close_position = 54;
    OrderListRequest order_list_request = 55;
    OrderList order_list = 56;
    DealHistoryRequest deal_history_request = 57;
    DealHistory deal_history = 58;
    DealUpdate deal_update = 43;
    Ack ack = 60;
    Error error = 61;
    // Added in v1.3: per-account client preferences (chart objects, alerts,
    // templates) stored on the server as an opaque JSON document.
    PrefsRequest prefs_request = 80;
    Prefs prefs = 81;
    PrefsSet prefs_set = 82;
    Heartbeat heartbeat = 70;
    Ping ping = 71;
    Pong pong = 72;
  }
}

// Client -> server, first frame. Server answers with its own Hello.
message Hello {
  uint32 protocol_version = 1;
  string client_name = 2;
  // Requested max quote rate in Hz (0 = server default; capped by server).
  uint32 max_quote_hz = 3;
}

// Client -> server: JWT bearer token.
message Auth {
  string token = 1;
}

message AuthOk {
  string subject = 1;
  repeated string account_ids = 2;
  uint64 expires_at_s = 3;
  // Added in v1.2: trading parameters of each authorized account (same order
  // as account_ids; may be empty on older servers or without a trading core).
  repeated AccountInfo accounts = 4;
}

// Added in v1.2.
enum MarginMode {
  MARGIN_MODE_UNSPECIFIED = 0;
  // One position per symbol; opposite fills reduce / reverse it.
  NETTING = 1;
  // Every fill opens its own position (several per symbol, both sides).
  HEDGING = 2;
}

// Added in v1.2: static trading parameters of an account.
message AccountInfo {
  string account_id = 1;
  string currency = 2;
  MarginMode margin_mode = 3;
  // Account leverage, e.g. 30 for 1:30 (symbol caps may be lower).
  uint32 leverage = 4;
  // Trading group (pricing / risk profile).
  string group = 5;
}

message Subscribe {
  string request_id = 1;
  repeated string symbols = 2;
  // v1.3: symbols to also stream `Depth` for (they are subscribed to quotes as well).
  repeated string depth_symbols = 3;
}

message Unsubscribe {
  string request_id = 1;
  repeated string symbols = 2;
  // v1.3: stop depth only; quotes of these symbols keep flowing.
  repeated string depth_symbols = 3;
}

message Quote {
  string symbol = 1;
  Decimal bid = 2;
  Decimal ask = 3;
  Decimal bid_size = 4;
  Decimal ask_size = 5;
  uint64 ts_ns = 6;
}

// Coalesced quotes: at most one (latest) quote per symbol.
message QuoteBatch {
  repeated Quote quotes = 1;
}

// v1.3: one price level of the LP book; qty in lots.
message DepthLevel {
  Decimal price = 1;
  Decimal qty = 2;
}

// v1.3: the LP book of a symbol as the connection's group sees it (markup applied
// to every level). Best level first. Sent at the quote flush rate, latest wins.
message Depth {
  string symbol = 1;
  repeated DepthLevel bids = 2;
  repeated DepthLevel asks = 3;
  uint64 ts_ns = 4;
}

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  M1 = 1;
  M5 = 2;
  M15 = 3;
  M30 = 4;
  H1 = 5;
  H4 = 6;
  D1 = 7;
}

message CandleRequest {
  string request_id = 1;
  string symbol = 2;
  Timeframe timeframe = 3;
  // Inclusive bucket-open bounds in ns since epoch; 0 = unbounded.
  uint64 from_ns = 4;
  uint64 to_ns = 5;
  // Max candles (most recent); 0 = server default.
  uint32 limit = 6;
}

message Candle {
  uint64 open_time_ns = 1;
  Decimal open = 2;
  Decimal high = 3;
  Decimal low = 4;
  Decimal close = 5;
  uint64 ticks = 6;
}

message CandleResponse {
  string request_id = 1;
  string symbol = 2;
  Timeframe timeframe = 3;
  repeated Candle candles = 4;
}

// Client -> server: list the instruments this gateway serves (added in v1.1;
// older servers answer Error{BAD_REQUEST}).
message SymbolListRequest {
  string request_id = 1;
}

message Instrument {
  // Client symbol, e.g. EURUSD.
  string symbol = 1;
  // Base / quote currency (or asset) codes, e.g. EUR / USD.
  string base = 2;
  string quote = 3;
  // Minimum price increment.
  Decimal tick_size = 4;
  // Minimum quantity increment (in base units).
  Decimal qty_step = 5;
  // Number of price decimals implied by tick_size.
  uint32 digits = 6;
  // Base units per 1.00 lot (e.g. 100000 for FX majors).
  Decimal contract_size = 7;
}

message SymbolList {
  string request_id = 1;
  repeated Instrument instruments = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
  // Added in v1.2: triggers a market order once the price reaches stop_price.
  STOP = 3;
  // Added in v1.2: becomes a limit order at limit_price once stop_price trades.
  STOP_LIMIT = 4;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  DAY = 1;
  GTC = 2;
  IOC = 3;
  FOK = 4;
  // Added in v1.2: good till PlaceOrder.expire_at_ns (pending orders only).
  GTD = 5;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING_NEW = 1;
  NEW = 2;
  PARTIALLY_FILLED = 3;
  FILLED = 4;
  CANCELED = 5;
  REPLACED = 6;
  REJECTED = 7;
  EXPIRED = 8;
}

message Position {
  string symbol = 1;
  // Signed quantity of this position (positive = long); 0 = closed.
  Decimal net_qty = 2;
  Decimal avg_price = 3;
  // Floating P&L in account currency (added in v1.1).
  Decimal unrealized_pnl = 4;
  // Added in v1.2. Server position id; hedging accounts hold several
  // positions per symbol, netting accounts at most one. Empty on servers
  // that only report one net position per symbol.
  string position_id = 5;
  Side side = 6;
  // Unsigned quantity (base units).
  Decimal qty = 7;
  // Protective levels (absent = none).
  Decimal sl = 8;
  Decimal tp = 9;
  // Server-side trailing stop distance in price units (absent = off).
  Decimal trailing_distance = 10;
  uint64 open_time_ns = 11;
}

message AccountSnapshot {
  string account_id = 1;
  string currency = 2;
  Decimal balance = 3;
  Decimal equity = 4;
  Decimal margin_used = 5;
  repeated Position positions = 6;
  // Added in v1.1: equity - margin_used, and equity / margin_used in percent
  // (absent without open margin). Also pushed whenever they change.
  Decimal free_margin = 7;
  Decimal margin_level = 8;
  // Added in v1.2.
  MarginMode margin_mode = 9;
  uint32 leverage = 10;
}

message PositionUpdate {
  string account_id = 1;
  Position position = 2;
}

message OrderUpdate {
  string account_id = 1;
  string client_request_id = 2;
  string order_id = 3;
  string symbol = 4;
  Side side = 5;
  OrderStatus status = 6;
  Decimal filled_qty = 7;
  Decimal leaves_qty = 8;
  Decimal avg_price = 9;
  Decimal last_qty = 10;
  Decimal last_price = 11;
  string text = 12;
  uint64 ts_ns = 13;
  // Added in v1.2: the order's current parameters (also after ModifyOrder).
  OrderType order_type = 14;
  Decimal qty = 15;
  Decimal limit_price = 16;
  Decimal stop_price = 17;
  Decimal sl = 18;
  Decimal tp = 19;
  Decimal trailing_distance = 20;
  uint64 oco_group = 21;
  uint64 expire_at_ns = 22;
  // Position opened / increased / closed by this order (empty if none yet).
  string position_id = 23;
  // Stop-limit: stop has triggered, the order now rests as a limit.
  bool stop_triggered = 24;
  // Order closes (part of) this position (ClosePosition, SL/TP, stop-out).
  string close_position_id = 25;
  uint64 created_ns = 26;
}

message PlaceOrder {
  // Client-chosen idempotency/correlation id, echoed in Ack/Error/OrderUpdate.
  string request_id = 1;
  string account_id = 2;
  string symbol = 3;
  Side side = 4;
  OrderType order_type = 5;
  Decimal qty = 6;
  Decimal limit_price = 7;
  TimeInForce tif = 8;
  // Added in v1.2.
  // Trigger price of STOP / STOP_LIMIT orders.
  Decimal stop_price = 9;
  // Protective levels attached to the resulting position.
  Decimal sl = 10;
  Decimal tp = 11;
  // Server-side trailing stop distance (price units) for the position.
  Decimal trailing_distance = 12;
  // One-cancels-other group (client chosen, per account; 0 = none): when one
  // pending order of the group executes, the others are cancelled.
  uint64 oco_group = 13;
  // Expiry of a pending order (ns since epoch; implies GTD; 0 = none).
  uint64 expire_at_ns = 14;
}

message CancelOrder {
  string request_id = 1;
  string account_id = 2;
  // request_id of the PlaceOrder (or last ModifyOrder) to cancel.
  string target_request_id = 3;
}

// Absent fields keep their value. Pending orders are modified in place (the
// order keeps its id and its target_request_id).
message ModifyOrder {
  string request_id = 1;
  string account_id = 2;
  string target_request_id = 3;
  Decimal qty = 4;
  Decimal limit_price = 5;
  // Added in v1.2.
  Decimal stop_price = 6;
  Decimal sl = 7;
  Decimal tp = 8;
  Decimal trailing_distance = 9;
  uint64 expire_at_ns = 10;
  // true: sl / tp / trailing_distance replace the current values and absent
  // means "remove"; false: absent keeps them.
  bool replace_protection = 11;
  // true: remove the expiry (GTC).
  bool clear_expiry = 12;
}

// Added in v1.2: sets the protection of an open position. Full replacement:
// an absent sl / tp / trailing_distance removes it.
message ModifyPosition {
  string request_id = 1;
  string account_id = 2;
  string position_id = 3;
  Decimal sl = 4;
  Decimal tp = 5;
  Decimal trailing_distance = 6;
}

// Added in v1.2: closes a position fully (qty absent) or partially at market.
// The closing order's OrderUpdates carry client_request_id = request_id.
message ClosePosition {
  string request_id = 1;
  string account_id = 2;
  string position_id = 3;
  Decimal qty = 4;
}

// Added in v1.2: working (pending) orders of an account.
message OrderListRequest {
  string request_id = 1;
  string account_id = 2;
  // v1.3: also return finished orders (filled, cancelled, rejected, expired),
  // newest first, at most 500.
  bool include_history = 3;
}

message OrderList {
  string request_id = 1;
  string account_id = 2;
  // Current state of every pending order (OrderUpdate shape, status NEW).
  repeated OrderUpdate orders = 3;
}

// Added in v1.2.
enum DealEntry {
  DEAL_ENTRY_UNSPECIFIED = 0;
  // Opened / increased a position.
  IN = 1;
  // Reduced / closed a position.
  OUT = 2;
}

enum DealReason {
  DEAL_REASON_UNSPECIFIED = 0;
  CLIENT = 1;
  STOP_LOSS = 2;
  TAKE_PROFIT = 3;
  STOP_OUT = 4;
}

// One execution against a position (a fill that reverses a netting position
// yields an OUT and an IN deal).
message Deal {
  string deal_id = 1;
  string order_id = 2;
  // Originating PlaceOrder / ClosePosition request_id (server generated for
  // SL / TP / stop-out closes).
  string client_request_id = 3;
  string position_id = 4;
  string symbol = 5;
  Side side = 6;
  DealEntry entry = 7;
  Decimal qty = 8;
  Decimal price = 9;
  // Realized P&L in account currency (OUT deals; 0 for IN).
  Decimal realized_pnl = 10;
  // Commission charged (negative = cost), account currency.
  Decimal commission = 11;
  uint64 ts_ns = 12;
  DealReason reason = 13;
}

// Added in v1.2: deal history, oldest first. Paging: pass the previous
// response's next_cursor as cursor until it comes back empty.
message DealHistoryRequest {
  string request_id = 1;
  string account_id = 2;
  // Inclusive time bounds (ns); 0 = unbounded.
  uint64 from_ns = 3;
  uint64 to_ns = 4;
  // Page size; 0 = server default (500), capped at 5000.
  uint32 limit = 5;
  string cursor = 6;
}

message DealHistory {
  string request_id = 1;
  string account_id = 2;
  repeated Deal deals = 3;
  // Empty = no more pages.
  string next_cursor = 4;
}

// Added in v1.2 (server): a new deal of an authorized account.
message DealUpdate {
  string account_id = 1;
  Deal deal = 2;
}

message Ack {
  string request_id = 1;
}

// Client -> server: the stored preferences of an account (answer: Prefs).
message PrefsRequest {
  string request_id = 1;
  string account_id = 2;
}

message Prefs {
  string request_id = 1;
  string account_id = 2;
  // Opaque JSON (empty = nothing stored).
  string json = 3;
}

// Client -> server: replaces the stored preferences (answer: Ack). At most 64 KiB.
message PrefsSet {
  string request_id = 1;
  string account_id = 2;
  string json = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  BAD_REQUEST = 1;
  UNSUPPORTED_VERSION = 2;
  UNAUTHENTICATED = 3;
  FORBIDDEN = 4;
  RATE_LIMITED = 5;
  UNKNOWN_SYMBOL = 6;
  UNKNOWN_ORDER = 7;
  UNAVAILABLE = 8;
  INTERNAL = 9;
  // Added in v1.1: pre-trade margin check failed.
  INSUFFICIENT_MARGIN = 10;
  // Added in v1.1: rejected by core risk / validation (see message).
  ORDER_REJECTED = 11;
}

message Error {
  string request_id = 1;
  ErrorCode code = 2;
  string message = 3;
}

message Heartbeat {
  uint64 ts_ns = 1;
}

message Ping {
  uint64 nonce = 1;
  uint64 ts_ns = 2;
}

message Pong {
  uint64 nonce = 1;
  uint64 ts_ns = 2;
}
