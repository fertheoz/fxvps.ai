# Security headers for the static web images (findings G6 / G13). Included at
# server level and again in every location that sets its own add_header (nginx
# does not inherit add_header into such locations).
# The page-specific script/connect policy is a <meta> CSP written at build time
# (apps/backoffice/scripts/csp.mjs); this header CSP adds what a meta tag cannot
# carry (frame-ancestors) and applies on top of it (both must allow a request).
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
