[package]
name = "fxvps-desktop"
version = "0.1.0"
description = "fxvps.ai desktop terminal (Tauri 2 shell around apps/terminal)"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.87"

# Not a member of the root Cargo workspace: it needs GTK/WebKit system libs on
# Linux, which the root `ci.yml` runner does not install. Built by desktop.yml.
[workspace]

[lib]
name = "fxvps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
