[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/fix-codec",
    "crates/fix-session",
    "services/lp-simulator",
    "services/fix-gateway",
    "crates/client-proto",
    "services/client-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.87"

[workspace.dependencies]
domain = { path = "crates/domain" }
fix-codec = { path = "crates/fix-codec" }
fix-session = { path = "crates/fix-session" }
lp-simulator = { path = "services/lp-simulator" }
fix-gateway = { path = "services/fix-gateway" }
client-proto = { path = "crates/client-proto" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
proptest = "1"
tempfile = "3"
async-nats = "0.38"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
