{{- if .Values.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "fxvps.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fxvps.selector" (dict "name" $name "root" $) | nindent 6 }}
  policyTypes: [Ingress]
  {{- if has "*" $svc.ingressFrom }}
  ingress:
    - {}
  {{- else if $svc.ingressFrom }}
  ingress:
    - from:
        {{- range $svc.ingressFrom }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ . }} }
        {{- end }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
