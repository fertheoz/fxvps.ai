global: { scrape_interval: 15s, evaluation_interval: 15s }
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  # NATS /varz Prometheus biçiminde değil; gerekirse prometheus-nats-exporter eklenir.
  - job_name: questdb
    static_configs: [{ targets: ["questdb:9003"] }]
