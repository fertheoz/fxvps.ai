# LMAX demo connectivity test: fix-gateway only (no customer data, no orders
# unless sent on purpose). Run from this directory: docker compose up -d
services:
  fix-gateway:
    image: ${FIX_GATEWAY_IMAGE:-ghcr.io/fertheoz/fxvps-fix-gateway:latest}
    command: ["/app/lmax/lmax-demo.toml"]
    env_file: .env
    environment:
      # Session table for a later core-engine (CORE_LP_STATUS_URL); loopback only.
      FIX_STATUS_ADDR: 0.0.0.0:9890
    volumes:
      - ./lmax-demo.toml:/app/lmax/lmax-demo.toml:ro
      # Image runs as uid 65532 (distroless nonroot): mkdir -p fix-store && chown 65532:65532 fix-store
      - ./fix-store:/var/lib/fix-gateway
    ports:
      - "127.0.0.1:9890:9890"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
