# fix-gateway -> LMAX DEMO (London). Fill the <...> values from the LMAX demo
# account's FIX details. Passwords are NOT stored here: they come from the
# environment (FIX_GATEWAY_MD_PASSWORD / FIX_GATEWAY_TRADE_PASSWORD, see .env).
lp = "LMAX"
heartbeat_secs = 30
market_depth = 5
reconnect_delay_ms = 5000            # do not hammer the LP while misconfigured
security_id_source = "8"             # [DOĞRULA] against the LMAX FIX spec
store_dir = "/var/lib/fix-gateway"   # persistent sequence numbers (volume)

[md]
addr = "<MD_HOST>:<MD_PORT>"
sender_comp_id = "<MD_SENDER_COMP_ID>"
target_comp_id = "<MD_TARGET_COMP_ID>"
username = "<LMAX_USERNAME>"
password = "set-in-env"              # overridden by FIX_GATEWAY_MD_PASSWORD
reset_on_logon = true                # [DOĞRULA] LMAX sequence reset policy

[md.tls]                             # remove this table if LMAX says plain TCP
# server_name = "<MD_HOST>"          # default: host part of addr
# ca_file = "/app/lmax/ca.pem"       # default: public (Mozilla) roots

[trade]
addr = "<TRADE_HOST>:<TRADE_PORT>"
sender_comp_id = "<TRADE_SENDER_COMP_ID>"
target_comp_id = "<TRADE_TARGET_COMP_ID>"
username = "<LMAX_USERNAME>"
password = "set-in-env"              # overridden by FIX_GATEWAY_TRADE_PASSWORD
reset_on_logon = true

[trade.tls]

# LMAX instrument ids (SecurityID). EUR/USD = 4001 is confirmed; check the
# others against the instrument list of the demo account.
[[instruments]]
symbol = "EUR/USD"
security_id = "4001"
tick_size = "0.00001"

[[instruments]]
symbol = "GBP/USD"
security_id = "4002"                 # [DOĞRULA]
tick_size = "0.00001"

[[instruments]]
symbol = "USD/JPY"
security_id = "4004"                 # [DOĞRULA]
tick_size = "0.001"
