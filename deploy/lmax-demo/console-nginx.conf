# Back office console: static files + same-origin proxy to the loopback core-engine.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/fxvps-security-headers.conf;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/fxvps-security-headers.conf;
    }
    location /v1/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /v1/ { proxy_pass http://127.0.0.1:8090; }
    location /auth/ { proxy_pass http://127.0.0.1:8090; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
