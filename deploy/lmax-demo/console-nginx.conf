# Back office console: static files + same-origin proxy to the loopback core-engine.
# Blue/green: admin API on 8090 (blue) or 8091 (green), whichever is active.
upstream fxvps_core {
    server 127.0.0.1:8090 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:8091 max_fails=1 fail_timeout=2s;
}
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/fxvps-security-headers.conf;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/fxvps-security-headers.conf;
    }
    location /v1/stream {
        proxy_pass http://fxvps_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /v1/ { proxy_pass http://fxvps_core; }
    location /auth/ { proxy_pass http://fxvps_core; }
    location / {
        # HTML is revalidated on every load, so a new build is picked up at once
        # (the hashed files under /assets/ stay cached).
        add_header Cache-Control "no-cache";
        include /etc/nginx/fxvps-security-headers.conf;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
