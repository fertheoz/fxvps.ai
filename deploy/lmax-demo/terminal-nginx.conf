# Client terminal (trade.fxvps.ai): static files + WebSocket proxy to client-gateway.
# Blue/green: only the active trading colour listens; nginx skips the closed port.
upstream fxvps_gw {
    server 127.0.0.1:8088 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:8089 max_fails=1 fail_timeout=2s;
}
server {
    listen 127.0.0.1:8082;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/fxvps-security-headers.conf;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/fxvps-security-headers.conf;
    }
    # Client self-service REST (funding requests, KYC uploads) -> gateway.
    location /api/ {
        proxy_pass http://fxvps_gw;
        proxy_next_upstream error timeout;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8m;
        proxy_read_timeout 60s;
    }
    location = /ws {
        proxy_pass http://fxvps_gw/ws;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
    location / {
        # HTML is revalidated on every load, so a new build is picked up at once
        # (the hashed files under /assets/ stay cached).
        add_header Cache-Control "no-cache";
        include /etc/nginx/fxvps-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
