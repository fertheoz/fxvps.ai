name: backoffice

on:
  push:
    branches: [main]
    paths:
      - "apps/backoffice/**"
      - "services/core-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/backoffice.yml"
  pull_request:
    paths:
      - "apps/backoffice/**"
      - "services/core-engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/backoffice.yml"

permissions:
  contents: read

concurrency:
  group: backoffice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backoffice/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backoffice-e2e
          path: |
            apps/backoffice/docs/screenshot.png
            apps/backoffice/test-results/
          if-no-files-found: ignore

  e2e-live:
    name: e2e:live (core-engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build core-engine
        working-directory: .
        run: cargo build --locked -p core-engine
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backoffice/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:live
        env:
          CI: "true"
          CORE_ENGINE_BIN: ${{ github.workspace }}/target/debug/core-engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backoffice-e2e-live
          path: apps/backoffice/test-results/
          if-no-files-found: ignore
