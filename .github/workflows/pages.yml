name: Pages

# terminal -> https://fertheoz.github.io/fxvps.ai/        (Vite base /fxvps.ai/)
# backoffice -> https://fertheoz.github.io/fxvps.ai/admin/ (NEXT_PUBLIC_BASE_PATH=/fxvps.ai/admin)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect apps
        id: apps
        run: |
          echo "terminal=$([ -f apps/terminal/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backoffice=$([ -f apps/backoffice/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Sürüm kök package.json "packageManager" alanından gelir (version: verilmez).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.apps.outputs.terminal == 'true' || steps.apps.outputs.backoffice == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.apps.outputs.terminal == 'true' || steps.apps.outputs.backoffice == 'true'
        with:
          node-version: 22
      - run: mkdir -p _site
      - name: Build terminal
        if: steps.apps.outputs.terminal == 'true'
        working-directory: apps/terminal
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm exec vite build --base=/fxvps.ai/
          cp -r dist/. ../../_site/
      - name: Build backoffice
        if: steps.apps.outputs.backoffice == 'true'
        working-directory: apps/backoffice
        env:
          NEXT_PUBLIC_BASE_PATH: /fxvps.ai/admin
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
          mkdir -p ../../_site/admin
          cp -r out/. ../../_site/admin/
      - name: Landing page fallback
        run: |
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html <<'HTML'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fxvps.ai</title></head>
          <body style="font-family:system-ui;max-width:40rem;margin:4rem auto;padding:0 1rem"><h1>fxvps.ai</h1><p>Trading platformu: yakında.</p><p><a href="admin/">Back office</a></p></body></html>
          HTML
          fi
          # SPA derin bağlantıları için
          [ -f _site/404.html ] || cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
