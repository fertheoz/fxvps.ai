name: Docker images

on:
  pull_request:
    paths: ["services/**", "crates/**", "apps/**", "Cargo.*", "infra/docker/**", ".github/workflows/docker.yml"]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (G12): read-only by default; only the push-on-main job below
# gets packages: write. Pull requests build without registry credentials.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests: build only (no push, no packages permission).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: lp-simulator, dockerfile: infra/docker/lp-simulator.Dockerfile, src: services/lp-simulator, args: "" }
          - { svc: fix-gateway, dockerfile: infra/docker/fix-gateway.Dockerfile, src: services/fix-gateway, args: "" }
          - { svc: client-gateway, dockerfile: infra/docker/client-gateway.Dockerfile, src: services/client-gateway, args: "" }
          - { svc: core-engine, dockerfile: infra/docker/core-engine.Dockerfile, src: services/core-engine, args: "" }
          - { svc: identity, dockerfile: infra/docker/identity.Dockerfile, src: services/identity, args: "" }
          - { svc: terminal, dockerfile: infra/docker/static-web.Dockerfile, src: apps/terminal, args: "APP=terminal\nOUT=dist" }
          # trade.fxvps.ai: identity login (id.fxvps.ai) and the gateway on the same host (/ws).
          - { svc: terminal-trade, dockerfile: infra/docker/static-web.Dockerfile, src: apps/terminal, args: "APP=terminal\nOUT=dist\nVITE_IDENTITY_URL=https://id.fxvps.ai\nVITE_DEFAULT_WS_URL=/ws" }
          - { svc: backoffice, dockerfile: infra/docker/static-web.Dockerfile, src: apps/backoffice, args: "APP=backoffice\nOUT=out" }
          # Same-origin console (nginx proxies /v1 to the admin API): identity login
          # (e-mail + password + 2FA at id.fxvps.ai); dev-token button for local use.
          - { svc: backoffice-console, dockerfile: infra/docker/static-web.Dockerfile, src: apps/backoffice, args: "APP=backoffice\nOUT=out\nNEXT_PUBLIC_API_URL=/\nNEXT_PUBLIC_DEV_AUTH=1\nNEXT_PUBLIC_IDENTITY_URL=https://id.fxvps.ai\nNEXT_PUBLIC_TERMINAL_URL=https://trade.fxvps.ai" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source exists (pending services are skipped)
        id: exists
        run: |
          if [ -d "${{ matrix.src }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.src }} not on this ref; skipping ${{ matrix.svc }}"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.exists.outputs.ok == 'true'
      - id: meta
        if: steps.exists.outputs.ok == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/fertheoz/fxvps-${{ matrix.svc }}
          tags: |
            type=sha,format=short
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.exists.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}

  publish:
    # push to main / manual: build and push to GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # G17: keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: lp-simulator, dockerfile: infra/docker/lp-simulator.Dockerfile, src: services/lp-simulator, args: "" }
          - { svc: fix-gateway, dockerfile: infra/docker/fix-gateway.Dockerfile, src: services/fix-gateway, args: "" }
          - { svc: client-gateway, dockerfile: infra/docker/client-gateway.Dockerfile, src: services/client-gateway, args: "" }
          - { svc: core-engine, dockerfile: infra/docker/core-engine.Dockerfile, src: services/core-engine, args: "" }
          - { svc: identity, dockerfile: infra/docker/identity.Dockerfile, src: services/identity, args: "" }
          - { svc: terminal, dockerfile: infra/docker/static-web.Dockerfile, src: apps/terminal, args: "APP=terminal\nOUT=dist" }
          # trade.fxvps.ai: identity login (id.fxvps.ai) and the gateway on the same host (/ws).
          - { svc: terminal-trade, dockerfile: infra/docker/static-web.Dockerfile, src: apps/terminal, args: "APP=terminal\nOUT=dist\nVITE_IDENTITY_URL=https://id.fxvps.ai\nVITE_DEFAULT_WS_URL=/ws" }
          - { svc: backoffice, dockerfile: infra/docker/static-web.Dockerfile, src: apps/backoffice, args: "APP=backoffice\nOUT=out" }
          # Same-origin console (nginx proxies /v1 to the admin API): identity login
          # (e-mail + password + 2FA at id.fxvps.ai); dev-token button for local use.
          - { svc: backoffice-console, dockerfile: infra/docker/static-web.Dockerfile, src: apps/backoffice, args: "APP=backoffice\nOUT=out\nNEXT_PUBLIC_API_URL=/\nNEXT_PUBLIC_DEV_AUTH=1\nNEXT_PUBLIC_IDENTITY_URL=https://id.fxvps.ai\nNEXT_PUBLIC_TERMINAL_URL=https://trade.fxvps.ai" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source exists (pending services are skipped)
        id: exists
        run: |
          if [ -d "${{ matrix.src }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.src }} not on this ref; skipping ${{ matrix.svc }}"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.exists.outputs.ok == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.exists.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.exists.outputs.ok == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/fertheoz/fxvps-${{ matrix.svc }}
          tags: |
            type=sha,format=short
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        if: steps.exists.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: steps.exists.outputs.ok == 'true'
      - name: Sign image (keyless, by digest)
        if: steps.exists.outputs.ok == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/fertheoz/fxvps-${{ matrix.svc }}@${DIGEST}"
