name: desktop

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/terminal/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'apps/terminal/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      # generate_context! needs frontendDist to exist; an empty dir is enough for checks.
      - run: mkdir -p ../../terminal/dist
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: rust-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install terminal deps (frontend built by beforeBuildCommand)
        working-directory: apps/terminal
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Install desktop deps (tauri cli)
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile
      # Unsigned debug build, no installers: no signing keys or updater keys needed.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --debug --no-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxvps-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/debug/fxvps-desktop
            apps/desktop/src-tauri/target/debug/fxvps-desktop.exe
          if-no-files-found: ignore
          retention-days: 7
