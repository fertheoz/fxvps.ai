name: trading-core

on:
  push:
    branches: [main]
    paths: ['packages/trading-core/**', '.github/workflows/trading-core.yml']
  pull_request:
    paths: ['packages/trading-core/**', '.github/workflows/trading-core.yml']

permissions:
  contents: read

concurrency:
  group: trading-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/trading-core

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/trading-core/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
