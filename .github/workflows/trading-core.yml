name: trading-core

on:
  push:
    branches: [main]
    paths: ['packages/trading-core/**', '.github/workflows/trading-core.yml']
  pull_request:
    paths: ['packages/trading-core/**', '.github/workflows/trading-core.yml']

permissions:
  contents: read

concurrency:
  group: trading-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/trading-core

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/trading-core/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
