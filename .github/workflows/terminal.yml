name: terminal

on:
  push:
    branches: [main]
    paths: ['apps/terminal/**', 'crates/**', 'services/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/terminal.yml']
  pull_request:
    paths: ['apps/terminal/**', 'crates/**', 'services/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/terminal.yml']

permissions:
  contents: read

concurrency:
  group: terminal-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/terminal

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/terminal/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/terminal/test-results
          retention-days: 7

  live-e2e:
    # Terminal against a real client-gateway (--demo: lp-simulator + fix-gateway in-process).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build client-gateway
        working-directory: .
        run: cargo build --locked -p client-gateway
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/terminal/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Generated protobuf code is up to date
        run: |
          pnpm proto:gen
          git diff --exit-code -- src/api/gen
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:live
        env:
          CI: 'true'
          FXVPS_GATEWAY_BIN: ${{ github.workspace }}/target/debug/client-gateway
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-live-report
          path: apps/terminal/test-results
          retention-days: 7
