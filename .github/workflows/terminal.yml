name: terminal

on:
  push:
    branches: [main]
    paths: ['apps/terminal/**', 'crates/**', 'services/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/terminal.yml']
  pull_request:
    paths: ['apps/terminal/**', 'crates/**', 'services/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/terminal.yml']

permissions:
  contents: read

concurrency:
  group: terminal-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/terminal

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/terminal/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/terminal/test-results
          retention-days: 7

  live-e2e:
    # Terminal against a real client-gateway (--demo: lp-simulator + fix-gateway in-process).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build client-gateway
        working-directory: .
        run: cargo build --locked -p client-gateway
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/terminal/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Generated protobuf code is up to date
        run: |
          pnpm proto:gen
          git diff --exit-code -- src/api/gen
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:live
        env:
          CI: 'true'
          FXVPS_GATEWAY_BIN: ${{ github.workspace }}/target/debug/client-gateway
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-report
          path: apps/terminal/test-results
          retention-days: 7
