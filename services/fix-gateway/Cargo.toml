[package]
name = "fix-gateway"
description = "FIX initiator gateway: LP market data + trading sessions normalized to domain events"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fix-gateway"
path = "src/main.rs"

[[bin]]
name = "denetci"
path = "src/bin/denetci.rs"
required-features = ["nats"]

[features]
default = []
nats = ["dep:async-nats", "dep:time", "dep:futures-util"]

[dependencies]
domain.workspace = true
fix-codec.workspace = true
fix-session = { workspace = true, features = ["tls"] }
webpki-roots = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
async-nats = { workspace = true, optional = true }
time = { version = "0.3", optional = true, features = ["std"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio-rustls.workspace = true
lp-simulator.workspace = true
tempfile.workspace = true

[lints]
workspace = true
