[package]
name = "fix-gateway"
description = "FIX initiator gateway: LP market data + trading sessions normalized to domain events"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fix-gateway"
path = "src/main.rs"

[features]
default = []
nats = ["dep:async-nats"]

[dependencies]
domain.workspace = true
fix-codec.workspace = true
fix-session = { workspace = true, features = ["tls"] }
webpki-roots = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
async-nats = { workspace = true, optional = true }

[dev-dependencies]
tokio-rustls.workspace = true
lp-simulator.workspace = true
tempfile.workspace = true

[lints]
workspace = true
