[package]
name = "core-engine"
description = "Single-writer OMS/risk/ledger engine service with journal, snapshots and admin HTTP"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
domain.workspace = true
fix-gateway = { workspace = true, features = ["nats"] }
thiserror.workspace = true
money.workspace = true
ledger.workspace = true
risk.workspace = true
oms.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jsonwebtoken = "9"
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
identity.workspace = true
lp-simulator.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
